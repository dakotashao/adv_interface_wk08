<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radical Swap</title>
<style>
/* Layout: iPad landscape. Right: a practice sheet — pinyin in four lines over a tian-zi grid, stroke order underneath. Left: meaning, parts, and the menu, set into the column. Set 1 tone: Matter-of-fact. */
:root{
  --ground:#000000;
  --paper:#f7f6f2;
  --field:#ffffff;
  --ink:#1c1c1a;
  --ink-2:#85837d;
  --ink-3:#b9b7b1;
  --rule:#dedcd6;
  --fill:#efeee9;
  --red:#c8432c;
  --guide:#efcfc7;      /* copybook red lines */
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --zh:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--ink);font:400 14px/1.45 var(--ui);-webkit-font-smoothing:antialiased;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.zh{font-family:var(--zh)}

/* device: designed at 1180 × 820, scaled to fit */
.stage{position:relative;margin:0 auto;width:min(100%,1000px,calc((100vh - 110px) * 1.439))}
.stage::before{content:"";display:block;padding-top:69.49%}
.ipad{position:absolute;top:0;left:0;width:1180px;height:820px;transform-origin:0 0;border-radius:26px;overflow:hidden;background:var(--field);
  box-shadow:0 0 0 1px rgba(0,0,0,.06),0 30px 80px rgba(0,0,0,.5);display:grid;grid-template-columns:380px 1fr}

/* left column */
.col{position:relative;background:var(--paper);padding:56px 44px 40px 52px;display:flex;flex-direction:column;min-height:0}
.nav{display:flex;align-items:baseline;gap:20px}
.nav button{border:0;background:none;padding:0 0 4px;font:400 17px var(--zh);color:var(--ink-3);cursor:pointer;border-bottom:1.5px solid transparent}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.crumbs{margin-top:18px;min-height:22px;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;font-size:13px;color:var(--ink-3)}
.crumbs button{border:0;background:none;padding:0;cursor:pointer;color:var(--ink-2)}
.crumbs .bk{font:500 13px var(--ui);margin-right:6px;color:var(--ink)}
.crumbs .bk:hover{color:var(--red)}
.crumbs .c{font:400 16px var(--zh)}
.crumbs .c:hover{color:var(--ink)}
.crumbs .now{color:var(--red);font:400 16px var(--zh)}

.title{margin-top:44px}
.ctx{min-height:18px;margin-bottom:8px;font-size:13px;color:var(--ink-2)}
.ctx .zh{color:var(--ink)}
.title h1{margin:0;display:flex;align-items:baseline;gap:12px;font:600 34px/1.15 var(--ui);letter-spacing:-.015em}
.title h1 .zh{font:500 38px/1 var(--zh);letter-spacing:0}
.title .py{margin-top:8px;font-size:15px;color:var(--ink-2)}
.title .py .zh{color:var(--ink)}
.desc{margin-top:22px;font-size:14.5px;line-height:23px;color:var(--ink-2);max-width:280px}
.desc .zh{color:var(--ink)}
.also{margin-top:18px;min-height:26px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.also .k{font-size:13px;color:var(--ink-2);margin-right:2px}
.also button{border:0;background:none;padding:0 0 2px;font:400 18px var(--zh);color:var(--ink);cursor:pointer;border-bottom:1px solid transparent}
.also button:hover{border-bottom-color:var(--ink)}

.focus{margin-top:auto}
#trigger{display:flex;align-items:baseline;gap:10px;width:100%;padding:0 0 12px;border:0;border-bottom:1px solid var(--ink);background:none;color:var(--ink);text-align:left;cursor:pointer;font:inherit}
#trigger .tl{font:500 15px var(--ui)}
#trigger .tz{font:400 15px var(--zh);color:var(--ink-2)}
#trigger .more{margin-left:auto;display:flex;align-items:center;color:var(--ink-2);transition:color .15s}
#trigger .more svg{width:13px;height:13px;transition:transform .2s}
#trigger:hover .more{color:var(--ink)}
#trigger{position:relative}
#trigger::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1.5px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.3,.8,.3,1)}
#trigger[aria-expanded="true"]::after{transform:scaleX(1)}
.anim.pv{stroke:var(--red)}
.st.hideW{opacity:0}
.order button{transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.order button:hover{transform:translateY(-3px)}
#trigger[aria-expanded="true"] .tl,#trigger[aria-expanded="true"] .more{color:var(--red)}
#trigger[aria-expanded="true"] .more svg{transform:rotate(180deg)}
#trigger:focus-visible{outline:2px solid var(--red);outline-offset:4px}
.cap,.fnote,.meta{display:none}

/* practice sheet */
.fieldarea{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--field)}
#pin{display:block;width:440px;height:84px;cursor:pointer;margin-bottom:18px;overflow:visible}
#pin line{stroke:var(--guide);stroke-width:1}
#pin text{font:400 50px var(--ui);fill:var(--ink);transition:fill .15s}
#pin .spk{color:var(--ink-3);transition:color .15s}
#pin:hover text{fill:var(--red)}#pin:hover .spk{color:var(--red)}
#pin.talking text{fill:var(--red)}
#glyph{width:440px;height:440px;overflow:visible;cursor:pointer}
#glyph .gr line{stroke:var(--guide);stroke-width:1;stroke-dasharray:6 6;vector-effect:non-scaling-stroke}
#glyph .gr rect{fill:none;stroke:var(--guide);stroke-width:1.5;vector-effect:non-scaling-stroke}
.order{margin-top:30px;width:600px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.order button{width:44px;height:44px;padding:0;border:0;background:none;cursor:pointer}
.order svg{display:block;width:100%;height:100%}
.order .bx{fill:none;stroke:var(--guide);stroke-width:14}
.order .cr{stroke:var(--guide);stroke-width:8;stroke-dasharray:28 28}
.order path{fill:var(--ink)}.order path.cur{fill:var(--red)}
.order button:hover .bx,.order button.on .bx{stroke:var(--ink)}
.order button:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.layer{transition:opacity .22s}
.st{fill:var(--ink);transition:fill .18s,opacity .18s,transform .45s cubic-bezier(.3,1.2,.4,1)}
#glyph.dim .st{opacity:.12}
#glyph.dim .st.hi{opacity:1}
.st.red{fill:var(--red)}
.st.new{fill:var(--red)}
.st.flash{animation:flash 1s ease-out}
@keyframes flash{0%{fill:var(--red)}100%{fill:var(--ink)}}
.num circle{fill:var(--red)}.num text{fill:#fff;font:500 40px var(--ui);text-anchor:middle;dominant-baseline:central}
.num.soft circle{fill:none;stroke:var(--ink-3);stroke-width:3}.num.soft text{fill:var(--ink-2)}
.arrow{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.anim{fill:none;stroke:var(--ink);stroke-width:128;stroke-linecap:round;stroke-linejoin:round}

/* ---------- MENU SYSTEM: set into the column ---------- */
.col.open .desc,.col.open .also{display:none}
.menu{margin-top:2px}
.page>*{will-change:clip-path}
.page.wr>*{animation:wr .44s cubic-bezier(.25,.8,.25,1) both;animation-delay:calc(var(--i,0)*40ms)}
.page.wl>*{animation:wl .44s cubic-bezier(.25,.8,.25,1) both;animation-delay:calc(var(--i,0)*40ms)}
.page.er>*{animation:er .22s cubic-bezier(.55,0,.8,.3) both;animation-delay:calc(var(--i,0)*18ms)}
.page.el>*{animation:el .22s cubic-bezier(.55,0,.8,.3) both;animation-delay:calc(var(--i,0)*18ms)}
@keyframes wr{from{clip-path:inset(-2px 100% -2px 0)}to{clip-path:inset(-2px 0 -2px 0)}}
@keyframes wl{from{clip-path:inset(-2px 0 -2px 100%)}to{clip-path:inset(-2px 0 -2px 0)}}
@keyframes er{from{clip-path:inset(-2px 0 -2px 0)}to{clip-path:inset(-2px 0 -2px 100%)}}
@keyframes el{from{clip-path:inset(-2px 0 -2px 0)}to{clip-path:inset(-2px 100% -2px 0)}}
.sec{display:flex;justify-content:space-between;padding:16px 0 6px;font-size:12.5px;color:var(--ink-2)}
.divider{height:0;margin:4px 0}
.back{display:flex;align-items:baseline;gap:8px;width:100%;padding:14px 0 8px;border:0;background:none;font:500 14px var(--ui);color:var(--ink);cursor:pointer;text-align:left}
.back .zh{font:400 15px var(--zh)}
.back .n{margin-left:auto;font-weight:400;font-size:13px;color:var(--ink-2)}
.back .ar{color:var(--ink-2);transition:transform .15s}
.back:hover .ar{transform:translateX(-3px);color:var(--ink)}
.item{position:relative;display:flex;align-items:center;gap:14px;width:100%;height:42px;padding:0;border:0;border-bottom:1px solid var(--rule);background:transparent;color:var(--ink);font:400 15px/20px var(--ui);text-align:left;cursor:pointer;transition:color .15s,border-color .15s}
.page .sec+.item,.page .back+.item{border-top:1px solid var(--rule)}
.lead{width:18px;height:18px;flex:none;display:grid;place-items:center;color:var(--ink-3);transition:color .15s}
.lead svg{width:100%;height:100%;overflow:visible}
.lead .g path{fill:var(--ink)}.lead .g path.on{fill:var(--red)}.lead .g path.off{opacity:.16}
.lead.icon svg{width:15px;height:15px}
.label{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;white-space:nowrap;overflow:hidden;transition:transform .2s cubic-bezier(.3,.9,.3,1)}
.label .zh{font:400 18px/1 var(--zh)}
.label .py{font-size:13px;color:var(--ink-2)}
.label .gl{font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis}
.trail{display:flex;align-items:center;gap:12px;flex:none;font-size:12.5px;color:var(--ink-3)}
.key{font-size:12px;color:var(--ink-3)}
.badge{font:500 13px var(--ui);color:var(--red)}
.bzh{font:400 15px var(--zh);color:var(--ink-3)}
.chev{width:11px;height:11px;color:var(--ink-3)}
.switch{font-size:12.5px;color:var(--ink-3);min-width:22px;text-align:right}
.switch::after{content:"Off"}
.item.on .switch{color:var(--red)}
.item.on .switch::after{content:"On"}
/* states */
.item::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1.5px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .3s cubic-bezier(.3,.8,.3,1),background-color .12s,height .12s}
.item:hover::after{transform:scaleX(1)}
.item.pressed::after{transform:scaleX(1);background:var(--red);height:2px;transition-duration:.12s}
.item[aria-disabled="true"]::after{display:none}
.item:hover .label{transform:translateX(4px)}
.item:hover .lead.icon{color:var(--ink)}
.item.pressed{color:var(--red)}
.item.pressed .lead.icon,.item.pressed .key,.item.pressed .chev{color:var(--red)}
.item.pressed .label{transform:translateX(8px)}
.item[aria-disabled="true"]{color:var(--ink-3);cursor:default}
.item[aria-disabled="true"]:hover{border-bottom-color:var(--rule)}
.item[aria-disabled="true"]:hover .label{transform:none}
.item:focus-visible{outline:none;border-bottom-color:var(--red)}

/* spec, below the device */
.spec{max-width:1000px;margin:20px auto 0;display:block;color:#e9e8e4;font-size:12.5px;line-height:19px}
body{display:flex;flex-direction:column;min-height:100vh;box-sizing:border-box}
.wrapall{width:100%;margin-block:auto}
.specbar{display:flex;justify-content:center;margin-top:22px}
.specbtn{height:32px;padding:0 16px;border:1px solid #3a3a38;border-radius:16px;background:transparent;color:#e9e8e4;font:500 13px var(--ui);cursor:pointer}
.specbtn:hover{border-color:#e9e8e4}
.specbtn[aria-expanded="true"]{background:#e9e8e4;color:#111;border-color:#e9e8e4}
.spec h2{margin:0;font:600 28px/1.15 var(--ui);letter-spacing:-.015em}
.spec p{color:var(--ink-2);font-size:14px;line-height:23px;max-width:320px}
.spec .tables{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.spec h3{margin:22px 0 6px;font:600 12.5px var(--ui);color:var(--red)}
.spec table{width:100%;border-collapse:collapse}
.spec td{padding:5px 0;border-bottom:1px solid #2c2c2a;vertical-align:top}
.spec td:first-child{color:#8a8883;width:40%}
@media (max-width:900px){.spec{grid-template-columns:1fr}.spec .tables{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrapall">
<div class="stage" id="stageBox">
<div class="ipad" id="ipad">
  <section class="col" id="col">
    <nav class="nav" id="nav"></nav>
    <div class="crumbs" id="trail"></div>
    <div class="title"><div class="ctx" id="ctx"></div><h1 id="def"></h1><div class="py" id="py"></div></div>
    <p class="desc" id="desc"></p>
    <div class="also" id="also"></div>
    <div class="focus">
      <div class="cap" id="cap" hidden></div>
      <button id="trigger" type="button" aria-haspopup="menu" aria-expanded="false"></button>
      <div class="fnote" id="fnote" hidden></div>
    </div>
    <div class="meta" id="meta"></div>
  </section>
  <section class="fieldarea" id="fieldarea">
    <svg id="pin" viewBox="0 0 440 84" role="button" tabindex="0" aria-label="Play pronunciation"></svg>
    <svg id="glyph" viewBox="0 0 1024 1024" role="img" aria-label="Character"></svg>
    <div class="order" id="order" aria-label="Stroke order"></div>
  </section>
</div>
</div>

<div class="specbar"><button class="specbtn" id="specBtn" type="button" aria-expanded="false">Spec</button></div>
<section class="spec" id="spec" hidden></section>
</div>

    b.innerHTML=`<svg viewBox="0 0 1024 1024"><rect class="bx" x="7" y="7" width="1010" height="1010"/><line class="cr" x1="512" y1="0" x2="512" y2="1024"/><line class="cr" x1="0" y1="512" x2="1024" y2="512"/><g transform="scale(.84) translate(98,98) scale(1,-1) translate(0,-900)">${d.s.slice(0,k+1).map((p,i)=>`<path d="${p}" class="${i===k?'cur':''}"/>`).join('')}</g></svg>`;
    b.onmouseenter=()=>{if(menu)return;hov={level:'stroke',stroke:k};paint()};b.onmouseleave=()=>{if(menu)return;hov=null;paint()};
    b.onclick=e=>{e.stopPropagation();closeMenu(true);pin={level:'stroke',stroke:k};hov=null;paint()};o.append(b)})}
const cap1=s=>s?s[0].toUpperCase()+s.slice(1):'';
const ordinal=n=>n+(['th','st','nd','rd'][(n%100>10&&n%100<14)?0:Math.min(n%10,4)%4]||'th');
function renderAll(){
  const d=CH[cur],P=POS[d.op];
  renderPinyin();renderOrder();
  const nav=$('nav');nav.innerHTML='';
  DATA.start.forEach(c=>{const b=document.createElement('button');b.type='button';b.textContent=c;b.setAttribute('aria-current',c===history[0]);
    b.onclick=e=>{e.stopPropagation();if(c===cur&&history.length===1)return;closeMenu();history=[c];cur=c;pulled.clear();pin={level:'char'};hov=null;buildGlyph();renderAll()};nav.append(b)});
  const tr=$('trail');tr.innerHTML='';
  if(history.length>1){const bk=document.createElement('button');bk.type='button';bk.className='bk';bk.textContent='← Back';bk.onclick=e=>{e.stopPropagation();back()};tr.append(bk);
    history.forEach((c,i)=>{if(i){const s=document.createElement('span');s.textContent='→';tr.append(s)}
      if(i===history.length-1){const s=document.createElement('span');s.className='now';s.textContent=c;tr.append(s)}
      else{const b=document.createElement('button');b.type='button';b.className='c';b.textContent=c;b.onclick=e=>{e.stopPropagation();history=history.slice(0,i+1);cur=c;pulled.clear();pin={level:'char'};hov=null;closeMenu();buildGlyph();renderAll()};tr.append(b)}})}
  paint()}
function back(){if(history.length<2)return;history.pop();cur=history[history.length-1];pulled.clear();pin={level:'char'};hov=null;closeMenu();buildGlyph();renderAll()}

/* ================= menu ================= */
function mini(c,on){const d=CH[c];let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const m of d.m)for(const[x,y]of m){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}
  const w=Math.max(x1-x0,y1-y0)+150,cx=(x0+x1)/2,cy=(y0+y1)/2,S=on==null?null:new Set(on);
  return `<svg viewBox="${cx-w/2} ${-(cy+w/2)} ${w} ${w}"><g class="g" transform="scale(1,-1)">${d.s.map((p,i)=>`<path d="${p}" class="${S?(S.has(i)?'on':'off'):''}"/>`).join('')}</g></svg>`}
const IC={write:'<path d="M2.5 13.5l1-3.6L11.3 2l2.7 2.7-7.9 7.8z"/><path d="M9.8 3.6l2.6 2.6"/>',apart:'<rect x="1.5" y="4" width="5" height="8" rx="1"/><rect x="9.5" y="4" width="5" height="8" rx="1"/>',
 related:'<circle cx="4" cy="8" r="2.2"/><circle cx="12" cy="3.8" r="2.2"/><circle cx="12" cy="12.2" r="2.2"/><path d="M6 7l4-2.2M6 9l4 2.2"/>',
 nums:'<circle cx="5" cy="5" r="3.2"/><path d="M4.6 3.9l.8-.5v3.4M10 9.5h4.5M10 12.5h4.5"/>',grid:'<rect x="1.5" y="1.5" width="13" height="13" rx="1"/><path d="M8 1.5v13M1.5 8h13"/><path d="M1.5 1.5l13 13M14.5 1.5l-13 13" stroke-dasharray="1.4 1.8"/>',
 next:'<path d="M3 8h9M8.5 4.5L12 8l-3.5 3.5"/>',sound:'<path d="M2 6h2.5L8 3v10L4.5 10H2z"/><path d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.5 3.8a6 6 0 0 1 0 8.4"/>',swap:'<path d="M2 5.5h11l-2.8-2.8M14 10.5H3l2.8 2.8"/>',up:'<path d="M8 13V3.5M4.5 7L8 3.5 11.5 7"/>'};
const ico=n=>`<span class="lead icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg></span>`;
const CHEV='<svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg>';
const keys=k=>k.split(' ').map(x=>`<span class="key">${x}</span>`).join('');
function relatedItem(pos,key){const d=CH[cur],k=d.k[pos],alts=d.a[1-pos];
  return{icon:'related',label:`Keep <span class="zh">${k}</span>, change the rest`,key,disabled:!alts.length,badge:alts.length||null,
    sub:{title:`Also with <span class="zh">${k}</span>`,n:alts.length,items:()=>alts.map((c,j)=>{const x=CH[c];return{alt:c,pos:1-pos,key:String(j+1),lead:mini(c,x.i[1-pos]),label:`<span class="zh">${c}</span><span class="py">${x.inf[0]}</span><span class="gl">${x.inf[1]}</span>`}})}}}
function swapItem(pos,key,label){const d=CH[cur],k=d.k[pos],alts=d.a[pos];
  return{icon:'swap',label:label||`Swap <span class="zh">${k}</span> for another part`,key,disabled:!alts.length,badge:alts.length||null,
    sub:{title:`Swap <span class="zh">${k}</span>`,n:alts.length,items:()=>alts.map((c,j)=>{const x=CH[c];return{alt:c,pos,key:String(j+1),lead:mini(c,x.i[pos]),bzh:x.k[pos],label:`<span class="zh">${c}</span><span class="py">${x.inf[0]}</span><span class="gl">${x.inf[1]}</span>`}})}}}
function itemsFor(f){
  const d=CH[cur],out=[];
  if(f.level==='part'){
    out.push({sec:'Practice'},{icon:'sound',label:'Listen',key:'P',act:()=>speak(d.k[f.part])},{icon:'write',label:'Write this part',key:'W',act:()=>write(d.i[f.part])},
      {icon:'apart',label:'Lift it out',key:'L',sw:()=>pulled.has(f.part),act:()=>{pulled.has(f.part)?pulled.delete(f.part):pulled.add(f.part);applyPull();paint()}},
      {sec:'Explore'},swapItem(f.part,'S'),relatedItem(f.part,'R'),{icon:'up',label:'Back to the whole character',key:'⎋',act:()=>{pin={level:'char'};paint()}});
  }else if(f.level==='stroke'){
    out.push({sec:'Practice'},{icon:'write',label:'Write this stroke',key:'W',act:()=>write([f.stroke])},
      {icon:'next',label:'Next stroke',key:'→',disabled:f.stroke>=d.s.length-1,act:()=>{pin={level:'stroke',stroke:f.stroke+1};paint();reopen()}},
      {sec:'Explore'},{icon:'up',label:`Back to <span class="zh" style="font-family:var(--zh)">${d.k[partOf(cur,f.stroke)]}</span>`,key:'⎋',act:()=>{pin={level:'part',part:partOf(cur,f.stroke)};paint()}});
  }else{
    out.push({sec:'Practice'},{icon:'sound',label:'Listen',key:'P',act:()=>speak(cur)},{icon:'write',label:'Write it',key:'W',act:()=>write(d.s.map((_,i)=>i))},
      {icon:'apart',label:'Take apart',key:'L',sw:()=>pulled.size===2,act:()=>{const a=pulled.size===2;pulled.clear();if(!a){pulled.add(0);pulled.add(1)}applyPull();paint()}},
      {sec:'Swap a part'},swapItem(0,'1',`${cap1(POS[d.op][0])} &nbsp;<span class="zh">${d.k[0]}</span>`),swapItem(1,'2',`${cap1(POS[d.op][1])} &nbsp;<span class="zh">${d.k[1]}</span>`));
  }
  out.push({div:1},{icon:'nums',label:'Stroke order',key:'N',sw:()=>showNums,act:()=>{showNums=!showNums;paint()}},
    {icon:'grid',label:'Grid',key:'G',sw:()=>showGrid,act:()=>{showGrid=!showGrid;glyph.querySelector('.gr').style.display=showGrid?'':'none'}});
  return out}
let menu=null,stack=[];
function itemHTML(it){const tr=[];const lead=it.lead?`<span class="lead">${it.lead}</span>`:ico(it.icon);
  if(it.badge)tr.push(`<span class="badge">${it.badge}</span>`);if(it.bzh)tr.push(`<span class="bzh">${it.bzh}</span>`);if(it.key)tr.push(keys(it.key));if(it.sw)tr.push('<span class="switch"></span>');if(it.sub&&!it.disabled)tr.push(CHEV);
  return lead+`<span class="label">${it.label}</span><span class="trail">${tr.join('')}</span>`}
function page(items,sub){const p=document.createElement('div');p.className='page';
  if(sub){const b=document.createElement('button');b.type='button';b.className='back';b.innerHTML=`<span class="ar">←</span>${sub.title}<span class="n">${sub.n}</span>`;b.onclick=e=>{e.stopPropagation();pop()};p.append(b)}
  for(const it of items){if(it.div){p.append(Object.assign(document.createElement('div'),{className:'divider'}));continue}
    if(it.sec){p.append(Object.assign(document.createElement('div'),{className:'sec',textContent:it.sec}));continue}
    const b=document.createElement('button');b.type='button';b.className='item';b.setAttribute('role','menuitem');b._it=it;b.innerHTML=itemHTML(it);if(it.disabled)b.setAttribute('aria-disabled','true');p.append(b)}
  return p}
function sync(){menu?.querySelectorAll('.item').forEach(b=>{if(b._it.sw)b.classList.toggle('on',b._it.sw())})}
function stagger(p,cls,rev){const kids=[...p.children];kids.forEach((k,i)=>k.style.setProperty('--i',rev?kids.length-1-i:i));
  p.classList.remove('wr','wl','er','el');void p.offsetWidth;p.classList.add(cls);return(cls[0]==='w'?440+kids.length*40:220+kids.length*18)}
function openMenu(){closeMenu(true);hov=null;menu=document.createElement('div');menu.className='menu';menu.setAttribute('role','menu');
  const t=$('trigger');stack=[page(itemsFor(pin))];menu.append(stack[0]);t.after(menu);$('col').classList.add('open');wire(menu);sync();stagger(stack[0],'wr');
  t.setAttribute('aria-expanded','true');paint()}
function reopen(){if(menu)openMenu()}
let busy=false;
function push(sub){if(busy)return;busy=true;const m=menu,old=stack[stack.length-1],p=page(sub.items(),sub);const t=stagger(old,'er');
  setTimeout(()=>{busy=false;if(menu!==m)return;old.hidden=true;menu.append(p);stack.push(p);stagger(p,'wr')},t)}
function pop(){if(stack.length<2||busy)return;busy=true;const m=menu,top=stack.pop();preview(null);const t=stagger(top,'el',true);
  setTimeout(()=>{busy=false;top.remove();if(menu!==m)return;const p=stack[stack.length-1];p.hidden=false;stagger(p,'wl')},t)}
function closeMenu(silent){const m=menu,top=stack[stack.length-1];menu=null;stack=[];busy=false;$('trigger').setAttribute('aria-expanded','false');
  if(!m){$('col').classList.remove('open');return}
  if(silent){m.remove();$('col').classList.remove('open');return}
  preview(null);const t=stagger(top,'el',true);setTimeout(()=>{m.remove();if(!menu){$('col').classList.remove('open');paint()}},t)}
function wire(m){
  m.addEventListener('pointerover',e=>{const b=e.target.closest('.item');if(!b||b._it.disabled)return;if(b._it.alt)preview(b._it.alt,b._it.pos);else if(layerB.style.opacity==='1')preview(null)});
  m.addEventListener('pointerleave',()=>{if(layerB.style.opacity==='1')preview(null)});
  m.addEventListener('pointerdown',e=>{e.stopPropagation();const b=e.target.closest('.item');if(!b||b._it.disabled)return;b.classList.add('pressed');if(b._it.alt)preview(b._it.alt,b._it.pos)});
  m.addEventListener('pointerup',e=>{const b=e.target.closest('.item');m.querySelectorAll('.pressed').forEach(x=>setTimeout(()=>x.classList.remove('pressed'),110));if(b)act(b)});
  m.addEventListener('pointercancel',()=>{m.querySelectorAll('.pressed').forEach(x=>x.classList.remove('pressed'));preview(null)});
  m.addEventListener('click',e=>e.stopPropagation())}
function act(b){const it=b._it;if(it.disabled)return;
  if(it.sub){push(it.sub);return}
  if(it.alt){closeMenu(true);go(it.alt,it.pos);return}
  if(it.act){it.act();sync();if(it.icon==='write'||it.icon==='up')closeMenu()}}

/* ================= pointing at the character ================= */
function strokeAt(e){const s=e.target.closest('.st');return s&&layerA.contains(s)?+s.dataset.i:-1}
glyph.addEventListener('pointermove',e=>{if(menu||writing)return;const i=strokeAt(e);const d=CH[cur];let h=null;
  if(i>=0){if(pin.level==='part'&&partOf(cur,i)===pin.part||pin.level==='stroke'&&partOf(cur,i)===partOf(cur,pin.stroke))h={level:'stroke',stroke:i};else h={level:'part',part:partOf(cur,i)}}
  if(JSON.stringify(h)!==JSON.stringify(hov)){hov=h;paint()}});
glyph.addEventListener('pointerleave',()=>{if(hov){hov=null;paint()}});
glyph.addEventListener('click',e=>{e.stopPropagation();if(writing)return;closeMenu(true);const i=strokeAt(e);
  if(i<0)pin={level:'char'};
  else if((pin.level==='part'&&partOf(cur,i)===pin.part)||(pin.level==='stroke'&&partOf(cur,i)===partOf(cur,pin.stroke)))pin={level:'stroke',stroke:i};
  else pin={level:'part',part:partOf(cur,i)};
  hov=null;paint()});
$('pin').addEventListener('click',e=>{e.stopPropagation();speak(cur)});
$('pin').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();speak(cur)}});
$('trigger').addEventListener('click',e=>{e.stopPropagation();if(menu)closeMenu();else openMenu()});
document.addEventListener('click',e=>{if(menu&&!e.target.closest('.menu'))closeMenu()});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(menu&&stack.length>1)pop();else if(menu)closeMenu();else if(pin.level==='stroke'){pin={level:'part',part:partOf(cur,pin.stroke)};paint()}else{pin={level:'char'};paint()}return}
  if(!menu&&e.key==='Backspace'){back();return}
  if(!menu)return;const k=e.key==='ArrowRight'?'→':e.key.toUpperCase();const p=stack[stack.length-1];
  const b=[...p.querySelectorAll('.item')].find(x=>x._it.key===k&&!x._it.disabled);
  if(b){b.classList.add('pressed');if(b._it.alt)preview(b._it.alt,b._it.pos);setTimeout(()=>{b.classList.remove('pressed');act(b)},130)}});

/* ================= fit device to window ================= */
function fit(){const box=$('stageBox').getBoundingClientRect();$('ipad').style.transform=`scale(${box.width/1180})`}
addEventListener('resize',fit);

/* ================= spec ================= */
$('spec').innerHTML=`<div class="tables"><div>
<h3>Trigger</h3><table><tr><td>Row</td><td>full column · padding 0 0 12 · rule 1 #1C1C1A</td></tr><tr><td>Label</td><td>SF Pro 15 / 500 · target 15 #85837D</td></tr><tr><td>Caret</td><td>13 · open: Close, #C8432C, caret 180°</td></tr></table>
<h3>Container</h3><table><tr><td>Width</td><td>column (284)</td></tr><tr><td>Fill · shadow</td><td>none · set into the column</td></tr><tr><td>Open</td><td>rows are written left → right like a 横 · clip reveal 440ms · 40ms apart</td></tr><tr><td>Close</td><td>rows are erased right → left, last row first · 220ms · 18ms apart</td></tr><tr><td>Submenu</td><td>forward: old rows erased, new rows written left → right · back: right → left</td></tr><tr><td>Trigger line</td><td>draws red left → right · 450ms</td></tr></table>
<h3>Section</h3><table><tr><td>Label</td><td>12.5 · #85837D · sentence case</td></tr><tr><td>Padding</td><td>16 0 6</td></tr></table>
<h3>Practice sheet</h3><table><tr><td>Pinyin</td><td>four lines 440 × 84 · 50 · tap to hear</td></tr><tr><td>Grid</td><td>tian-zi 440 · dashed cross · #EFCFC7</td></tr><tr><td>Stroke order</td><td>44 boxes · gap 8 · newest stroke #C8432C</td></tr></table>
</div><div>
<h3>Item</h3><table><tr><td>Height</td><td>42 · rule 1 #DEDCD6 below</td></tr><tr><td>Gap</td><td>14</td></tr><tr><td>Label</td><td>SF Pro 15/20 · 汉字 PingFang 18</td></tr><tr><td>Lead</td><td>18 slot · icon 15 stroke 1.35 #B9B7B1 · or glyph</td></tr><tr><td>Shortcut</td><td>12 · #B9B7B1</td></tr><tr><td>Badge</td><td>13 / 500 · #C8432C</td></tr><tr><td>Right icon</td><td>chevron 11 · On / Off 12.5</td></tr></table>
<h3>States</h3><table><tr><td>Default</td><td>rule #DEDCD6</td></tr><tr><td>Hover</td><td>an ink line is drawn along the rule, left → right, 300ms · label moves 4px · a swap writes the new part into the grid stroke by stroke (420ms, 60ms apart)</td></tr><tr><td>Pressed</td><td>line turns #C8432C, 2px · text red · label moves 8px</td></tr><tr><td>Disabled</td><td>#B9B7B1 · no movement</td></tr></table>
<h3>Configurations</h3><table><tr><td>Single line</td><td>Write it</td></tr><tr><td>Left icon</td><td>every row</td></tr><tr><td>Shortcut</td><td>P · W · L · S · R · N · G</td></tr><tr><td>Badge</td><td>characters you can make</td></tr><tr><td>Right icon</td><td>chevron · On / Off</td></tr><tr><td>Sections</td><td>Practice · Swap a part · Explore</td></tr><tr><td>Submenu</td><td>Right 火 › 和 种 利 科 程 秒 积</td></tr></table>
</div></div>`;

$('specBtn').onclick=e=>{e.stopPropagation();const s=$('spec');s.hidden=!s.hidden;e.currentTarget.setAttribute('aria-expanded',!s.hidden);if(!s.hidden)s.scrollIntoView({behavior:'smooth',block:'start'})};
buildGlyph();renderAll();fit();
</script>
