<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>adv_interface wk08 · Menu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400&display=swap">
<style>
:root{--ground:#1D1D1D;--muted:#7D7D7D;--ink:#141414;--cream:#F5F0E8;--lemon:#EAEA00;--violet:#8E1FEF;
  --font:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;--spring:cubic-bezier(.34,1.56,.64,1)}
html,body{margin:0;min-height:100%}
body{background:#121212;color:var(--cream);font-family:var(--font);font-weight:300;padding:0 16px}
main{max-width:900px;margin:72px auto;background:var(--ground);padding:56px clamp(20px,5vw,64px);box-sizing:border-box}
p{margin:0}
.eyebrow{font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-weight:300;font-size:clamp(30px,5vw,44px);letter-spacing:-.015em;margin:14px 0 40px}
.sets{display:flex;flex-direction:column;gap:14px}
a.set{display:inline-flex;align-items:center;gap:14px;align-self:flex-start;height:56px;padding:0 16px 0 22px;border-radius:999px;
  background:var(--lemon);color:var(--ink);text-decoration:none;font-size:26px;transition:border-radius .2s ease,transform .14s ease}
a.set:hover,a.set:focus-visible{border-radius:0;outline:none}
a.set:active{transform:scaleY(.9)}
a.set .n{font-size:13px;opacity:.55}
a.set .go{width:36px;height:36px;border-radius:50%;background:var(--violet);display:grid;place-items:center;margin-left:8px}
a.set .go svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.3;transition:transform .45s var(--spring)}
a.set:hover .go svg{transform:translateX(3px)}
.note{margin-top:8px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Advanced Interface · Week 8</p>
  <h1>Menu</h1>
  <div class="sets">
    <a class="set" href="one-line-plan/"><span class="n">1</span>One-Line Plan<span class="go"><svg viewBox="0 0 18 18"><path d="M2 9h14M10 3l6 6-6 6"/></svg></span></a>
    <p class="note">A plan written as one sentence; each colored word is a menu. Spec inside the prototype.</p>
  </div>
</main>
</body>
</html>
