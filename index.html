<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu &amp; Toolbar</title>
<style>
:root{--ink:#111113;--muted:#6f7177;--tile:#f5f5f5}
html,body{margin:0;background:#fff;color:var(--ink)}
body{font:400 17px/1.3 -apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif;letter-spacing:.01em;padding:0 10px 10px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:16px 6px 18px}
h1{font:inherit;margin:0}
header p{margin:0;color:var(--muted);text-align:right}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.grid{grid-template-columns:1fr}}
.tile{position:relative;display:block;aspect-ratio:3/2;background:var(--tile);border-radius:12px;overflow:hidden;container-type:inline-size;color:inherit;text-decoration:none}
.tile iframe{position:absolute;left:0;top:0;width:1200px;height:800px;border:0;pointer-events:none;transform-origin:0 0;transform:scale(.3)}
.label{position:absolute;left:10px;bottom:10px;padding:7px 11px;border-radius:7px;background:#fff;font-size:14px;opacity:0;transform:translateY(3px);transition:opacity .16s,transform .16s}
.tile:hover .label,.tile:focus-visible .label{opacity:1;transform:none}
.tile:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (hover:none){.label{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.label{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Menu &amp; Toolbar</h1>
  <p>Advanced Interface, Week 8</p>
</header>
<main class="grid">
  <a class="tile" href="one-line-plan/" data-vw="1200" data-hide=".specwrap,.read">
    <iframe data-src="one-line-plan/" title="" loading="lazy" tabindex="-1" aria-hidden="true"></iframe>
    <span class="label">One-Line Plan</span>
  </a>
  <a class="tile" href="margin-toolbar/" data-vw="1300" data-hide=".specwrap,.read">
    <iframe data-src="margin-toolbar/" title="" loading="lazy" tabindex="-1" aria-hidden="true"></iframe>
    <span class="label">Margin Toolbar</span>
  </a>
</main>
<script>
/* each tile shows a live preview of its set, scaled to the tile */
const v=Date.now();
document.querySelectorAll('.tile').forEach(t=>{
  const f=t.querySelector('iframe'),vw=+t.dataset.vw||1200;
  f.style.width=vw+'px';f.style.height=Math.round(vw*2/3)+'px';
  f.src=f.dataset.src+(f.dataset.src.includes('?')?'&':'?')+'v='+v;
  new ResizeObserver(()=>{f.style.transform=`scale(${t.clientWidth/vw})`}).observe(t);
  f.addEventListener('load',()=>{try{if(t.dataset.hide){const s=f.contentDocument.createElement('style');
    s.textContent=t.dataset.hide+'{visibility:hidden!important}';f.contentDocument.head.appendChild(s)}}catch(e){}});
});
</script>
</body>
</html>
